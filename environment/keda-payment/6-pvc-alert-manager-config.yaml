apiVersion: monitoring.coreos.com/v1beta1
kind: AlertmanagerConfig
metadata:
  name: payment-pvc-rulebook-activation
  namespace: payment
  annotations:
    argocd.argoproj.io/sync-wave: "6"
spec:
  global:
    resolve_timeout: 5s
  route:
    receiver: webhook
    groupBy: ['alertname']
    groupInterval: 5s
    groupWait: 1s
    repeatInterval: 1h
  receivers:
    - name: webhook
      webhookConfigs:
      - url: http://payment-pvc-rulebook-activation.aap.svc.cluster.local:5000/endpoint