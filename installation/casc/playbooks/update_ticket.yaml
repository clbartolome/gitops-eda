---
- name: Add information to Servicenow Ticket
  hosts: localhost
  gather_facts: true
  tasks:

    - name: Add information to Servicenow Incident
      servicenow.itsm.api:
        resource: incident
        action: patch
        sys_id: "{{ ansible_eda.event.sys_id }}"
        data:
          state: 3
          incident_state: 3
          number: "{{ incident_id }}"
          work_notes: "{{ message }}. Check the current values in the file {{ manifest[0] }} stored in the repository {{ repository }}"
          caller: "ansible"
          severity: 2
          priority: 3
          
