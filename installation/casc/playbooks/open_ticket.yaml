---
- name: Open Ticket
  hosts: localhost
  gather_facts: false
  tasks:

    - name: Open ServiceNow incident
      servicenow.itsm.incident:
        state: new
        caller: "ansible"
        short_description: "{{ title }}"
        description: "{{ description }}Check manifest: {{ manifest }}"
        impact: "high"
        urgency: "high"
      register: incident

    - name: Set ServiceNow incident state
      servicenow.itsm.incident:
        state: in_progress
        number: "{{ incident.record.number }}"

    - name: Set ServiceNow incident number
      ansible.builtin.set_stats:
        data:
          incident: "{{ incident.record.number }}"

    - name: Silence Alarms
      kubernetes.core.k8s_exec:
        namespace: openshift-monitoring
        pod: alertmanager-main-0
        command: "amtool silence add --alertmanager.url http://localhost:9093  alertname={{ alert }} --comment 'ACK'"
