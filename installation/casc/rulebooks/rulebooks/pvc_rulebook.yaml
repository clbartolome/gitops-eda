- name: EDA Listener for Alertmanager and Servicenow - PVC
  hosts: localhost
  sources:
    - name: Listen to Alertmanager
      ansible.eda.alertmanager:
        host: 0.0.0.0
        port: 5000
        data_host_path: ""

    - name: Check new Incidents
      cloin.eda.snow_records:
        instance: "{{ instance }}"
        username: "{{ username }}"
        password: "{{ password }}"
        table: incident
        interval: 1
  rules:
    - name: Get Alertmanager Alerts
      condition: event.alert.labels.alertname == "PVCUsageHigh" and event.alert.status == "firing"
      action:
        run_job_template:
          name: "[JT] Open Servicenow Ticket"
          organization: "Default"
          job_args:
            extra_vars:
              title: "{{ event.alert.labels.alertname }} - {{ event.alert.annotations.summary }}"
              description: "{{ event.alert.annotations.description }}"
              date: "{{ event.alert.startsAt }}"
              manifest: "{{ event.alert.labels.manifest }}"

    - name: Trigger Remediation for PVCUsageHigh
      condition: event.short_description is regex("^PVCUsageHigh.*", ignorecase=false)
      action:
        run_workflow_template:
          name: "[WF] Extend Openshift Physical Volume"
          organization: "Default"
          job_args:
            extra_vars:
              incident_id: "{{ event.number }}"
              description: "{{ event.description }}"
