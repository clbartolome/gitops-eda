---
- name: Include vars
  ansible.builtin.include_vars:
    file: vars/servicenow/snow_user.yaml

- name: Check if Ansible EDA user already exists
  servicenow.itsm.api_info:
    instance:
      host: "{{ sn_host }}"
      username: "{{ sn_username }}"
      password: "{{ sn_password }}"
    resource: sys_user
    sysparm_query: "user_name={{ snow_user.username }}"
    columns:
      - sys_id
  retries: 5
  delay: 10
  register: snow_eda_user_info

- name: Create Ansible EDA user if doesn't exists
  servicenow.itsm.api:
    instance:
      host: "{{ sn_host }}"
      username: "{{ sn_username }}"
      password: "{{ sn_password }}"
    resource: sys_user
    action: post
    data:
      first_name: "{{ snow_user.firstname }}"
      last_name: "{{ snow_user.lastname }}"
      name: "{{ snow_user.firstname }}"
      user_name: "{{ snow_user.username }}"
      user_password: "{{ snow_user.password }}"
      title: "{{ snow_user.username }}"
    query_params:
      sysparm_input_display_value: true
  register: new_snow_eda_user_info
  when: snow_eda_user_info.record | length == 0

- name: Retrieve Ansible EDA user sys_id
  ansible.builtin.set_fact:
    snow_eda_user_sys_id: "{{ item | json_query(query) }}"
  vars:
    query: "record[0].sys_id || record.sys_id"
  loop:
    - "{{ snow_eda_user_info }}"
    - "{{ new_snow_eda_user_info }}"
  when: item.record is defined

- name: Upload profile picture
  servicenow.itsm.attachment_upload:
    instance:
      host: "{{ sn_host }}"
      username: "{{ sn_username }}"
      password: "{{ sn_password }}"
    table_name: ZZ_YYsys_user
    table_sys_id: "{{ snow_eda_user_sys_id }}"
    attachments:
      - path: "{{ snow_user.avatar }}"
        name: "{{ snow_user.username }}"
  register: upload_result

- debug: msg="{{ upload_result }}"

- name: Upload profile picture
  servicenow.itsm.api:
    instance:
      host: "{{ sn_host }}"
      username: "{{ sn_username }}"
      password: "{{ sn_password }}"
    action: patch
    resource: sys_attachment
    sys_id: "{{ item.sys_id }}"
    data:
      filename: "thumb_{{ item.sys_id }}"
  register: upload_result
  loop: "{{ upload_result.records }}"

- debug: msg="{{ upload_result }}"


- name: Update profile picture
  servicenow.itsm.api:
    instance:
      host: "{{ sn_host }}"
      username: "{{ sn_username }}"
      password: "{{ sn_password }}"
    resource: sys_user
    action: patch
    sys_id: "{{ snow_eda_user_sys_id }}"
    data:
      photo: "{{ upload_result.results[0].item.sys_id }}"

- name: Get Admin role information
  servicenow.itsm.api_info:
    instance:
      host: "{{ sn_host }}"
      username: "{{ sn_username }}"
      password: "{{ sn_password }}"
    resource: sys_user_role
    sysparm_query: "name={{ snow_user.role }}"
    columns:
      - sys_id
  register: snow_admin_role_info

- name: Retrieve role sys_id
  ansible.builtin.set_fact:
    snow_admin_role_sys_id: "{{ snow_admin_role_info | json_query(query) }}"
  vars:
    query: "record[0].sys_id || record.sys_id"
  when: snow_admin_role_info.record is defined

- name: Check if Ansible EDA user and its role are already linked
  servicenow.itsm.api_info:
    instance:
      host: "{{ sn_host }}"
      username: "{{ sn_username }}"
      password: "{{ sn_password }}"
    resource: sys_user_has_role
    sysparm_query: "user={{ snow_eda_user_sys_id }}^role={{ snow_admin_role_sys_id }}"
    columns:
      - sys_id
  register: snow_eda_user_role_link_info

- name: Link Ansible EDA user and its role
  servicenow.itsm.api:
    instance:
      host: "{{ sn_host }}"
      username: "{{ sn_username }}"
      password: "{{ sn_password }}"
    resource: sys_user_has_role
    action: post
    data:
      user: "{{ snow_eda_user_sys_id }}"
      role: "{{ snow_admin_role_sys_id }}"
  register: new_user_role_link_sys_id
  when: snow_eda_user_role_link_info.record | length== 0

